<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Outer circle -->
  <circle cx="24" cy="24" r="21" fill="#0f172a" stroke="url(#grad1)" stroke-width="2.5"/>
  <!-- Sub-ring -->
  <circle cx="24" cy="24" r="17" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="2 3"/>
  <!-- Center dot -->
  <circle cx="24" cy="24" r="2.5" fill="#38bdf8"/>
  <!-- Clock hands -->
  <line x1="24" y1="24" x2="24" y2="13" stroke="#f8fafc" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="24" y1="24" x2="31" y2="24" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  <!-- Top button -->
  <rect x="21" y="0.5" width="6" height="3" rx="1" fill="#38bdf8"/>
</svg>
